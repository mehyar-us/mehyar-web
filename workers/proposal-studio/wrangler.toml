name = "mehyarsoft-proposal-studio"
main = "src/index.ts"
compatibility_date = "2026-08-27"

[vars]
PUBLIC_SITE_URL = "https://mehyar.us"
CLOUDFLARE_ACCOUNT_ID = "621600637337cc1c9ecb7095508bc732"
AI_GATEWAY_ID = "mehyar-us"
PRIMARY_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
FALLBACK_MODEL = ""
DEEP_REASONING_MODEL = "@cf/moonshotai/kimi-k2.6"
IMAGE_MODEL = "@cf/black-forest-labs/flux-1-schnell"

[[routes]]
pattern = "studio-api.mehyar.us/*"
zone_name = "mehyar.us"

[[d1_databases]]
binding = "DB"
database_name = "mehyar_leads_prod"
database_id = "e4f22065-e3e8-4772-87a8-51d4976be042"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "mehyarsoft-reports"

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[[workflows]]
name = "mehyarsoft-proposal-workflow"
binding = "PROPOSAL_WORKFLOW"
class_name = "ProposalWorkflow"

[observability]
enabled = true
head_sampling_rate = 1
