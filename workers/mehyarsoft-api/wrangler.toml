name = "mehyarsoft-api"
main = "src/index.js"
compatibility_date = "2026-05-11"

[vars]
BUSINESS_NAME = "MehyarSoft LLC"
PUBLIC_SITE_URL = "https://mehyar.us"
OWNER_EMAIL = "info@mehyar.us"
MEHYARSOFT_ZOHO_CONTACT_EMAIL = "info@mehyar.us"
MEHYARSOFT_ZOHO_TARGET_FORWARD_EMAIL = "info@mehyar.us"
MEHYARSOFT_ZOHO_ACCOUNTS_BASE = "https://accounts.zoho.com"
MEHYARSOFT_ZOHO_MAIL_API_BASE = "https://mail.zoho.com/api"
MEHYARSOFT_ZOHO_CALENDAR_API_BASE = "https://calendar.zoho.com/api/v1"
MEHYARSOFT_ZOHO_AUTHORIZED_REDIRECT_URI = "https://api.mehyar.us/oauth/zoho/callback"
MEHYARSOFT_ADMIN_MAIL_DAILY_SEND_CAP = "25"
MEHYARSOFT_ADMIN_NOTIFICATION_DAILY_CAP = "100"

[[routes]]
pattern = "api.mehyar.us/*"
zone_name = "mehyar.us"

[[d1_databases]]
binding = "DB"
database_name = "mehyarsoft-db"
database_id = "b7838a67-36eb-47b0-b44a-7f6dc5bac2fa"

[[kv_namespaces]]
binding = "KV"
id = "20669073208d473ab28e4a639f38b1d7"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "mehyarsoft-reports"

[[queues.producers]]
binding = "JOBS"
queue = "mehyarsoft-agent-jobs"

[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *"]
