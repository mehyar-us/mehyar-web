name = "mehyar-mayor"
main = "src/index.ts" # TODO: real entry unknown
compatibility_date = "2026-05-11"
workers_dev = false

[vars]
APP_ORIGIN = "https://mayor.mehyar.us"
ENVIRONMENT = "production"
MAYOR_EMAIL_FROM = "team@mehyar.us"
# MAYOR_AUDIT_* plain-text vars live in dashboard; add here only if safe.

[[d1_databases]]
binding = "AGENT_DB"
database_name = "mehyar-mayor"
database_id = "701b5ade-45a6-491a-889d-42d79f6f59a0"

[ai]
binding = "AI"

[assets]
directory = "./public" # TODO: confirm assets dir from real source
binding = "ASSETS"

