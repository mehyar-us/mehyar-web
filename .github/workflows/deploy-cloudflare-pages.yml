name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - 'functions/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'wrangler.toml'
      - '.github/workflows/deploy-cloudflare-pages.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_AI_GATEWAY_TOKEN: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Verify deploy-time configuration
        run: |
          test -n "$VITE_TURNSTILE_SITE_KEY" || { echo "VITE_TURNSTILE_SITE_KEY is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CLOUDFLARE_EMAIL" || { echo "CLOUDFLARE_EMAIL is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_KEY" || { echo "CLOUDFLARE_API_KEY is missing"; exit 1; }
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm run test:intake
      - run: CUSTOM_DOMAIN=true NODE_ENV=production npm run build:client
      - name: Probe CF AI Gateway reachability
        run: |
          if [ -n "$CLOUDFLARE_AI_GATEWAY_TOKEN" ]; then
            RESP=$(curl -fsS -o /tmp/ai_test.json -w "%{http_code}" \
              -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/meta/llama-3.2-3b-instruct" \
              -H "Authorization: Bearer $CLOUDFLARE_AI_GATEWAY_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"messages":[{"role":"user","content":"Reply OK"}]}')
            echo "CF AI Gateway: HTTP $RESP"
            head -c 200 /tmp/ai_test.json
          else
            echo "CLOUDFLARE_AI_GATEWAY_TOKEN is empty"
          fi
      - name: Verify Turnstile site key was compiled into the client bundle
        run: |
          if grep -R "Preparing secure verification" dist/public/assets/*.js >/dev/null; then
            echo "Runtime Turnstile fallback path exists in bundle. Checking compiled key and runtime endpoint separately."
          fi
          grep -R "$VITE_TURNSTILE_SITE_KEY" dist/public/assets/*.js >/dev/null || { echo "Turnstile site key was not compiled into the client bundle"; exit 1; }
          grep -R "/api/client-config" dist/public/assets/*.js >/dev/null || { echo "Runtime client config endpoint path is missing from the client bundle"; exit 1; }
          test -f functions/api/client-config.js || { echo "Runtime client config function is missing"; exit 1; }
          ! grep -R "TURNSTILE_SECRET_KEY" dist/public/assets/*.js >/dev/null || { echo "Secret env name leaked into client bundle"; exit 1; }
      - name: Deploy Pages site and Functions
        run: |
          echo "Deploying (secrets restored via API after deploy)..."
          npx wrangler pages deploy dist/public --project-name=mehyar-web --branch=main
      - name: Restore secrets via Cloudflare API
        run: |
          echo "Restoring secrets (wrangler deploy wipes API-set vars)..."
          python3 << 'PYEOF'
          import json, urllib.request, os
          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          email = os.environ["CLOUDFLARE_EMAIL"]
          api_key = os.environ["CLOUDFLARE_API_KEY"]
          secrets = {
              "MEHYARSOFT_ADMIN_EMAIL": os.environ.get("SECRET_ADMIN_EMAIL", ""),
              "MEHYARSOFT_ADMIN_USERNAME": os.environ.get("SECRET_ADMIN_USERNAME", ""),
              "MEHYARSOFT_API_ADMIN_USERNAME": os.environ.get("SECRET_API_ADMIN_USERNAME", ""),
              "MEHYARSOFT_ADMIN_PASSWORD": os.environ.get("SECRET_ADMIN_PASSWORD", ""),
              "CLOUDFLARE_EMAIL": email,
              "AUDIT_CRON_SECRET": os.environ.get("SECRET_AUDIT_CRON", ""),
              "TURNSTILE_SECRET_KEY": os.environ.get("SECRET_TURNSTILE", ""),
              "CRM_ACCESS_CLIENT_ID": os.environ.get("SECRET_CRM_ID", ""),
              "ADMIN_SESSION_SECRET": os.environ.get("SECRET_SESSION", ""),
          }
          # Filter out empty
          secrets = {k: v for k, v in secrets.items() if v}
          env_vars = {k: {"type": "plain_text", "value": v} for k, v in secrets.items()}
          data = json.dumps({
              "deployment_configs": {
                  "production": {"env_vars": env_vars},
                  "preview": {"env_vars": env_vars}
              }
          }).encode()
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects/mehyar-web",
              data=data, method="PATCH",
              headers={"Content-Type": "application/json", "X-Auth-Email": email, "X-Auth-Key": api_key}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              result = json.loads(r.read())
              print(f"Secrets restore: {'OK' if result.get('success') else 'FAILED'}")
          PYEOF
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          SECRET_ADMIN_EMAIL: ${{ secrets.MEHYARSOFT_ADMIN_EMAIL }}
          SECRET_ADMIN_USERNAME: ${{ secrets.MEHYARSOFT_ADMIN_USERNAME }}
          SECRET_API_ADMIN_USERNAME: ${{ secrets.MEHYARSOFT_API_ADMIN_USERNAME }}
          SECRET_ADMIN_PASSWORD: ${{ secrets.MEHYARSOFT_ADMIN_PASSWORD }}
          SECRET_AUDIT_CRON: ${{ secrets.AUDIT_CRON_SECRET }}
          SECRET_TURNSTILE: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SECRET_CRM_ID: ${{ secrets.CRM_ACCESS_CLIENT_ID }}
          SECRET_SESSION: ${{ secrets.ADMIN_SESSION_SECRET }}
      - name: Verify production runtime client config
        run: |
          CONFIG_JSON="$(curl -fsS https://mehyar.us/api/client-config)"
          echo "$CONFIG_JSON" | node -e '
            let body = "";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const config = JSON.parse(body);
              if (!/^0x[A-Za-z0-9_-]{16,}$/.test(config.turnstileSiteKey || "")) throw new Error("runtime Turnstile site key missing");
              if (/secret|private|token/i.test(JSON.stringify(config))) throw new Error("runtime config exposes a sensitive-looking key");
            });
          '