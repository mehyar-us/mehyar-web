<script async src="https://www.googletagmanager.com/gtag/js?id=G-25N8E18944"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-25N8E18944'); /* page_view fires automatically */
</script>
<link rel="stylesheet" href="./chat.css">
<link rel="stylesheet" href="./call.css">
<style>
  :root { color-scheme: light; }
  /* The voice-call UI keeps its own dark FaceTime styling (rendered by
     call-shell.js into #call-root once the call starts). */
  body { margin: 0; background: #faf8f5; }
  #call-root:empty { min-height: 100dvh; }
</style>
</head>
<body>
<main id="call-root" aria-label="Assessment call"></main>
<script type="module">
  import { ChatOnramp } from "./chat.js";
  import { CallShell } from "./call-shell.js";
  import { createStubAvatar, createStubVoiceTransport } from "./stubs.js";
  // Demo/test wiring: stub avatar + stub voice transport.
  // Production swaps:
  //   createStubAvatar()        -> the avatar crew's mountAvatar(container, opts)
  //   createStubVoiceTransport() -> the voice team's transport (same 7-method API)
  // The ChatOnramp, CallShell and VoiceAdapter only need those two contracts.

  const root = document.getElementById("call-root");
  const avatar = createStubAvatar();
  const transport = createStubVoiceTransport();

  const chat = new ChatOnramp({
    avatarSrc: "./mayor-avatar.png",
    onHandoff: async ({ brainSessionId }) => {
      // Same brain session continues on voice — the chat was the on-ramp.
      const shell = new CallShell({ avatar, transport });
      shell.root = root;
      root.classList.remove("chat-page");
      document.body.style.background = "#0f172a"; // call UI is dark FaceTime-style
      await shell.startVoiceCall({ brainSessionId });
      window.__callShell = shell; // test hook
    },
  });
  chat.mount(root);
  window.__chatOnramp = chat; // test hook

  // CTA click tracking (mirrors GoogleAnalytics.tsx installCtaTracking):
  // any click on [data-analytics-cta] fires cta_click.
  document.addEventListener("click", (event) => {
    const target = event.target instanceof Element ? event.target.closest("[data-analytics-cta]") : null;
    if (!target || typeof gtag !== "function") return;
    const label = (target.textContent || "").replace(/\s+/g, " ").trim().slice(0, 120);
    gtag("event", "cta_click", { label, location: window.location.pathname });
  }, { capture: true });
</script>
</body>
