  .ac-end { background: #ef4444; color: #fff; border: 0; border-radius: 10px; padding: 12px 24px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .ac-error { color: #fca5a5; }

<main id="call-root" aria-label="Assessment call"></main>
<script type="module">
  import { CallShell } from "./call-shell.js";
  import { createStubAvatar, createStubVoiceTransport } from "./stubs.js";
  // Demo/test wiring: stub avatar + stub voice transport.
  // Production swaps:
  //   createStubAvatar()        -> the avatar crew's mountAvatar(container, opts)
  //   createStubVoiceTransport() -> the voice team's transport (same 7-method API)
  // The CallShell and VoiceAdapter only need those two contracts.
  const shell = new CallShell({
    avatar: createStubAvatar(),
    transport: createStubVoiceTransport(),
  });
  shell.mount(document.getElementById("call-root"));
  window.__callShell = shell; // test hook
  // CTA click tracking (mirrors GoogleAnalytics.tsx installCtaTracking):
  // any click on [data-analytics-cta] fires cta_click.
  document.addEventListener("click", (event) => {
    const target = event.target instanceof Element ? event.target.closest("[data-analytics-cta]") : null;
    if (!target || typeof gtag !== "function") return;
    const label = (target.textContent || "").replace(/\s+/g, " ").trim().slice(0, 120);
    gtag("event", "cta_click", { label, location: window.location.pathname });
  }, { capture: true });
</script>
